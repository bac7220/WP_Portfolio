<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f05033"/>
      <stop offset="100%" style="stop-color:#ff8c69"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ea043"/>
      <stop offset="100%" style="stop-color:#56d364"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="80" y1="0" x2="80" y2="720"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="240" y1="0" x2="240" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="400" y1="0" x2="400" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="560" y1="0" x2="560" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="720" y1="0" x2="720" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="880" y1="0" x2="880" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1040" y1="0" x2="1040" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
    <line x1="1200" y1="0" x2="1200" y2="720"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="720" fill="url(#accent)"/>

  <!-- Git Graph visualization (right side) -->
  <g transform="translate(820, 100)" opacity="0.9">

    <!-- Branch lines -->
    <!-- main line (vertical) -->
    <line x1="60" y1="30" x2="60" y2="510" stroke="#f05033" stroke-width="3" opacity="0.8"/>
    <!-- dev branch line -->
    <line x1="60" y1="200" x2="180" y2="280" stroke="#56d364" stroke-width="3" opacity="0.8"/>
    <line x1="180" y1="280" x2="180" y2="400" stroke="#56d364" stroke-width="3" opacity="0.8"/>
    <!-- merge back -->
    <line x1="180" y1="400" x2="60" y2="460" stroke="#56d364" stroke-width="3" opacity="0.8"/>

    <!-- Commit dots - main -->
    <circle cx="60" cy="60" r="14" fill="#f05033" filter="url(#glow)"/>
    <circle cx="60" cy="140" r="14" fill="#f05033" filter="url(#glow)"/>
    <circle cx="60" cy="220" r="14" fill="#f05033" filter="url(#glow)"/>
    <circle cx="60" cy="460" r="14" fill="#f05033" filter="url(#glow)"/>
    <circle cx="60" cy="510" r="14" fill="#f05033" opacity="0.4"/>

    <!-- Commit dots - dev branch -->
    <circle cx="180" cy="310" r="14" fill="#56d364" filter="url(#glow)"/>
    <circle cx="180" cy="390" r="14" fill="#56d364" filter="url(#glow)"/>

    <!-- Labels -->
    <rect x="85" y="44" width="120" height="32" rx="6" fill="#ffffff" opacity="0.06"/>
    <text x="97" y="65" fill="#e6edf3" font-size="14" opacity="0.8">index.html追加</text>

    <rect x="85" y="124" width="120" height="32" rx="6" fill="#ffffff" opacity="0.06"/>
    <text x="97" y="145" fill="#e6edf3" font-size="14" opacity="0.8">style.css追加</text>

    <rect x="85" y="204" width="120" height="32" rx="6" fill="#ffffff" opacity="0.06"/>
    <text x="97" y="225" fill="#e6edf3" font-size="14" opacity="0.8">カラー変更</text>

    <rect x="205" y="294" width="120" height="32" rx="6" fill="#2ea043" opacity="0.15"/>
    <text x="217" y="315" fill="#56d364" font-size="14" opacity="0.9">devコミット</text>

    <rect x="85" y="444" width="120" height="32" rx="6" fill="#ffffff" opacity="0.06"/>
    <text x="97" y="465" fill="#e6edf3" font-size="14" opacity="0.8">マージ完了</text>

    <!-- Branch tag - main -->
    <rect x="20" y="10" width="78" height="26" rx="13" fill="#f05033" opacity="0.2"/>
    <rect x="20" y="10" width="78" height="26" rx="13" fill="none" stroke="#f05033" stroke-width="1.5" opacity="0.6"/>
    <text x="59" y="28" fill="#f05033" font-size="13" text-anchor="middle" font-weight="bold">main</text>

    <!-- Branch tag - dev -->
    <rect x="140" y="256" width="78" height="26" rx="13" fill="#2ea043" opacity="0.2"/>
    <rect x="140" y="256" width="78" height="26" rx="13" fill="none" stroke="#56d364" stroke-width="1.5" opacity="0.6"/>
    <text x="179" y="274" fill="#56d364" font-size="13" text-anchor="middle" font-weight="bold">dev</text>

  </g>

  <!-- Left content area -->
  <!-- Badge: 初心者向け -->
  <rect x="80" y="90" width="160" height="36" rx="18" fill="#f05033" opacity="0.15"/>
  <rect x="80" y="90" width="160" height="36" rx="18" fill="none" stroke="#f05033" stroke-width="1.5" opacity="0.7"/>
  <text x="160" y="114" fill="#ff8c69" font-size="15" text-anchor="middle" font-weight="bold">🔰 初心者向け</text>

  <!-- Main title -->
  <text x="80" y="210" fill="#ffffff" font-size="62" font-weight="bold" letter-spacing="-1">Gitって何？</text>

  <!-- Sub title line 1 -->
  <text x="80" y="285" fill="#e6edf3" font-size="38" font-weight="bold" opacity="0.95">初心者でも実践できる！</text>

  <!-- Accent underline -->
  <rect x="80" y="300" width="560" height="4" rx="2" fill="url(#accent)" opacity="0.7"/>

  <!-- Sub title line 2 -->
  <text x="80" y="360" fill="#8b949e" font-size="30">はじめてのバージョン管理入門</text>

  <!-- Feature list -->
  <g transform="translate(80, 410)">
    <!-- item 1 -->
    <circle cx="12" cy="14" r="6" fill="#f05033" opacity="0.9"/>
    <text x="30" y="20" fill="#c9d1d9" font-size="22">コミット・チェックアウト・ブランチ・マージ</text>

    <!-- item 2 -->
    <circle cx="12" cy="58" r="6" fill="#56d364" opacity="0.9"/>
    <text x="30" y="64" fill="#c9d1d9" font-size="22">VS Code + GitGraph でGUIから操作</text>

    <!-- item 3 -->
    <circle cx="12" cy="102" r="6" fill="#58a6ff" opacity="0.9"/>
    <text x="30" y="108" fill="#c9d1d9" font-size="22">実際のコードで手を動かして学ぶ</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="648" width="1280" height="72" fill="#ffffff" opacity="0.03"/>
  <line x1="0" y1="648" x2="1280" y2="648" stroke="#ffffff" stroke-width="1" opacity="0.08"/>

  <!-- Git logo text (bottom left) -->
  <text x="80" y="695" fill="#f05033" font-size="22" font-weight="bold" opacity="0.8">Git</text>
  <text x="118" y="695" fill="#8b949e" font-size="22" opacity="0.6">入門ガイド</text>

  <!-- Right bottom tag -->
  <rect x="980" y="660" width="220" height="38" rx="6" fill="#f05033" opacity="0.12"/>
  <text x="1090" y="685" fill="#ff8c69" font-size="18" text-anchor="middle" opacity="0.9">ノウハウ図書館</text>

</svg>
