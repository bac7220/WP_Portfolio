name: Deploy to Xserver

on:
  push:
    branches:
      - main
      - master # あなたのブランチ名がmasterの場合も動くようにしています

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync files to Server
        env:
          PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_IP }}
          USER: ${{ secrets.SERVER_USER }}
          # エックスサーバー: /home/サーバーID/ドメイン名/public_html/wp-content/themes/bac-portfolio
          TARGET: /home/xs393017/web-okuda.com/public_html/wp-content/themes/bac-portfolio
        run: |
          echo "$PRIVATE_KEY" > private_key && chmod 600 private_key
          # エックスサーバーはSSHポートが 10022。rsyncを使ってファイルを同期（node_modulesなどは除外）
          rsync -avz --delete -e "ssh -i private_key -p 10022 -o StrictHostKeyChecking=no" ./ $USER@$HOST:$TARGET --exclude '.git/' --exclude '.github/' --exclude 'node_modules/' --exclude 'private_key'
          rm -f private_key